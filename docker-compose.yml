services:
  visa_app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        - NEXT_PUBLIC_CLERK_SIGN_IN_URL=${NEXT_PUBLIC_CLERK_SIGN_IN_URL:-/sign-in}
        - NEXT_PUBLIC_CLERK_SIGN_UP_URL=${NEXT_PUBLIC_CLERK_SIGN_UP_URL:-/sign-up}
        - NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL=${NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL:-/dashboard}
        - NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL=${NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL:-/dashboard}
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://visa.docswellat.com}
    container_name: visa_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - POTHIKVISA_DB_PATH=/app/data/pothikvisa.db
      - HEADLESS=true
    volumes:
      - ./data:/app/data
      - ./downloads:/app/downloads
      - ./browser-data:/app/browser-data
    networks:
      - buzzlab_network

networks:
  buzzlab_network:
    external: true
    name: buzzlab_buzzlab_network
